                if (email.value) {
                    otpSent.value = true;

            };

                const code = otp.value.join('');
                if (code.length === 6) {
                    // Mock verification
                    if (email.value.includes('admin')) {
                        emit('login-success', 'admin');
                    } else if (email.value.includes('customer')) {
                        emit('login-success', 'customer');
                    } else {
                        emit('login-success', 'user');
                    }
                } else {
                    alert('Please enter the 6-digit code.');
                }
            };

                const value = event.target.value;
                if (value.length === 1 && index < otp.value.length - 1) {
                    otpInputs.value[index + 1].focus();
                }
            };

            return { email, otpSent, otp, otpInputs, sendOtp, verifyOtp, handleOtpInput };

            const searchQuery = ref('');

            const typeFilter = ref('');

            const filteredMachines = computed(() => {
                let filtered = props.machines;

                if (searchQuery.value) {
                    const lowerCaseQuery = searchQuery.value.toLowerCase();
                    filtered = filtered.filter(machine =>
                        machine.name.toLowerCase().includes(lowerCaseQuery) ||
                        machine.serial.toLowerCase().includes(lowerCaseQuery)
                    );
                }

                if (statusFilter.value) {
                    filtered = filtered.filter(machine => machine.status === statusFilter.value);
                }

                if (typeFilter.value) {
                    filtered = filtered.filter(machine => machine.type === typeFilter.value);
                }

                return filtered;
            });

            const statusClass = (status) => {
                switch (status) {
                    case 'Online': return { badge: 'bg-green-500/10 text-green-500 dark:bg-green-500/20', dot: 'bg-green-500' };

                    case 'Warning': return { badge: 'bg-yellow-500/10 text-yellow-500 dark:bg-yellow-500/20', dot: 'bg-yellow-500' };
                    case 'Maintenance': return { badge: 'bg-gray-500/10 text-gray-500 dark:bg-gray-500/20', dot: 'bg-gray-500' };
                    default: return { badge: 'bg-gray-500/10 text-gray-500 dark:bg-gray-500/20', dot: 'bg-gray-500' };
                }
            };

            return { searchQuery, statusFilter, typeFilter, filteredMachines, statusClass };
        }

                                            <input v-model="newMachine.department" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light-primary dark:text-text-dark-primary focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-white dark:bg-neutral-dark/30 h-11 placeholder:text-secondary px-3 text-sm font-normal leading-normal"/>
                                        </label>
                                    </div>
                                </div>
                                <!-- Notes Section -->
                                <div>
                                    <h3 class="text-text-light-primary dark:text-text-dark-primary text-lg font-bold leading-tight tracking-tight mb-4">Notes & History</h3>
                                    <div>
                                        <label class="flex flex-col">
                                            <p class="text-text-light-primary dark:text-text-dark-primary text-sm font-medium leading-normal pb-2">Maintenance Notes</p>
                                            <textarea v-model="newMachine.notes" class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-text-light-primary dark:text-text-dark-primary focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-white dark:bg-neutral-dark/30 min-h-32 placeholder:text-secondary p-3 text-sm font-normal leading-normal"></textarea>
                                        </label>
                                    </div>
                                </div>
                                <!-- Action Area -->
                                <div class="flex items-center justify-end gap-4 mt-10 pt-6 border-t border-border-light dark:border-border-dark">
                                    <button @click="$emit('cancel-add')" type="button" class="px-4 py-2 text-sm font-semibold text-text-light-secondary dark:text-text-dark-secondary bg-white dark:bg-neutral-dark/50 border border-border-light dark:border-border-dark rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600">Cancel</button>
                                    <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-primary rounded-lg shadow-sm hover:bg-primary/90">Add Machine</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        `,
        setup(_, { emit }) {
            const newMachine = ref({
                id: null,
                name: '',
                status: 'Online',
                location: '',
                lastCheckin: 'Just now',
                type: 'Type A',
                assetId: '',
                serial: '',
                temp: 75,
                lastServiced: new Date().toISOString().slice(0, 10),
                department: '',
                notes: ''
            });

            const add = () => {
                emit('add-machine-submit', { ...newMachine.value, id: Date.now() });
            };

            return { newMachine, add };
        }
    };

    // Customer Dashboard Component
    const CustomerDashboardComponent = {
        template: `
            <div class="relative flex min-h-screen w-full flex-row">
                <!-- SideNavBar -->
                <aside class="flex h-screen min-h-screen flex-col border-r border-stone-200 bg-white p-4 dark:border-stone-800 dark:bg-neutral-dark sticky top-0 w-64 shrink-0">
                    <div class="flex h-full flex-col justify-between">
                        <div class="flex flex-col gap-6">
                            <div class="flex items-center gap-3 px-3">
                                <span class="material-symbols-outlined text-primary text-3xl">deployed_code</span>
                                <h2 class="text-lg font-bold text-text-light-primary dark:text-text-dark-primary">MachineCorp</h2>
                            </div>
                            <div class="flex flex-col gap-4">
                                <div class="flex items-center gap-3 px-3">
                                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" :style="{ 'background-image': 'url(' + user.avatar + ')' }"></div>
                                    <div class="flex flex-col">
                                        <h1 class="text-text-light-primary dark:text-text-dark-primary text-base font-medium leading-normal">{{ user.name }}</h1>
                                        <p class="text-text-light-secondary dark:text-text-dark-secondary text-sm font-normal leading-normal">Customer</p>
                                    </div>
                                </div>
                                <div class="flex flex-col gap-1">
                                    <a @click.prevent="$emit('navigate', 'dashboard')" :class="{'bg-primary/20 text-primary dark:bg-primary/30': view === 'dashboard'}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5" href="#">
                                        <span class="material-symbols-outlined text-primary">dashboard</span>
                                        <p class="text-sm font-medium leading-normal">Dashboard</p>
                                    </a>
                                    <a @click.prevent="$emit('navigate', 'service-history')" :class="{'bg-primary/20 text-primary dark:bg-primary/30': view === 'service-history'}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5" href="#">
                                        <span class="material-symbols-outlined">history</span>
                                        <p class="text-sm font-medium leading-normal">Service History</p>
                                    </a>
                                    <a @click.prevent="$emit('navigate', 'profile')" :class="{'bg-primary/20 text-primary dark:bg-primary/30': view === 'profile'}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5" href="#">
                                        <span class="material-symbols-outlined">person</span>
                                        <p class="text-sm font-medium leading-normal">Profile</p>
                                    </a>
                                    <a @click.prevent="$emit('navigate', 'support')" :class="{'bg-primary/20 text-primary dark:bg-primary/30': view === 'support'}" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5" href="#">
                                        <span class="material-symbols-outlined">support_agent</span>
                                        <p class="text-sm font-medium leading-normal">Support</p>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <a @click="$emit('logout')" href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5">
                                <span class="material-symbols-outlined">logout</span>
                                <p class="text-sm font-medium leading-normal">Log Out</p>
                            </a>
                        </div>
                    </div>
                </aside>
                <!-- Main Content -->
                <main class="flex-1 p-8 bg-background-light dark:bg-background-dark">
                    <div v-if="view === 'dashboard'">
                        <div class="mx-auto flex w-full max-w-7xl flex-col gap-6">
                            <!-- PageHeading -->
                            <div class="flex flex-wrap items-center justify-between gap-4">
                                <h1 class="text-text-light-primary dark:text-text-dark-primary text-3xl font-bold tracking-tight">My Machines</h1>
                            </div>
                            <div class="flex flex-col gap-4 rounded-xl border border-border-light dark:border-border-dark bg-neutral-light dark:bg-neutral-dark/50 p-4">
                                <!-- Table -->
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead>
                                            <tr class="border-b border-border-light dark:border-border-dark">
                                                <th class="cursor-pointer p-4 text-left text-sm font-semibold text-text-light-secondary dark:text-text-dark-secondary">Machine Name</th>
                                                <th class="cursor-pointer p-4 text-left text-sm font-semibold text-text-light-secondary dark:text-text-dark-secondary">Serial Number</th>
                                                <th class="cursor-pointer p-4 text-left text-sm font-semibold text-text-light-secondary dark:text-text-dark-secondary">Status</th>
                                                <th class="cursor-pointer p-4 text-left text-sm font-semibold text-text-light-secondary dark:text-text-dark-secondary">Last Check-in</th>
                                                <th class="p-4 text-left text-sm font-semibold text-text-light-secondary dark:text-text-dark-secondary">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="machine in machines" :key="machine.id" class="border-b border-border-light dark:border-border-dark hover:bg-background-light dark:hover:bg-neutral-dark/50">
                                                <td class="p-4 align-middle text-sm font-medium text-text-light-primary dark:text-text-dark-primary">{{ machine.name }}</td>
                                                <td class="p-4 align-middle text-sm text-text-light-secondary dark:text-text-dark-secondary">{{ machine.serial }}</td>
                                                <td class="p-4 align-middle">
                                                    <div class="flex items-center gap-2 rounded-full px-3 py-1 text-sm font-medium w-fit" :class="statusClass(machine.status).badge">
                                                        <span class="h-2 w-2 rounded-full" :class="statusClass(machine.status).dot"></span>
                                                        <span>{{ machine.status }}</span>
                                                    </div>
                                                </td>
                                                <td class="p-4 align-middle text-sm text-text-light-secondary dark:text-text-dark-secondary">{{ machine.lastCheckin }}</td>
                                                <td class="p-4 align-middle">
                                                    <button @click="$emit('view-details', machine)" class="flex h-8 w-8 items-center justify-center rounded-lg text-text-light-secondary hover:bg-stone-200 hover:text-stone-800 dark:hover:bg-stone-800 dark:hover:text-stone-200">
                                                        <span class="material-symbols-outlined text-xl">visibility</span>
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div v-if="view === 'service-history'"><h1 class="text-3xl font-bold">Service History</h1></div>
                    <div v-if="view === 'profile'"><h1 class="text-3xl font-bold">Profile</h1></div>
                    <div v-if="view === 'support'"><h1 class="text-3xl font-bold">Support</h1></div>
                </main>
            </div>
        `,
        props: ['machines', 'user', 'view'],
        setup(props) {
            const statusClass = (status) => {
                switch (status) {
                    case 'Online': return { badge: 'bg-green-500/10 text-green-500 dark:bg-green-500/20', dot: 'bg-green-500' };
                    case 'Offline': return { badge: 'bg-red-500/10 text-red-500 dark:bg-red-500/20', dot: 'bg-red-500' };
                    case 'Warning': return { badge: 'bg-yellow-500/10 text-yellow-500 dark:bg-yellow-500/20', dot: 'bg-yellow-500' };
                    case 'Maintenance': return { badge: 'bg-gray-500/10 text-gray-500 dark:bg-gray-500/20', dot: 'bg-gray-500' };
                    default: return { badge: 'bg-gray-500/10 text-gray-500 dark:bg-gray-500/20', dot: 'bg-gray-500' };
                }
            };

            return { statusClass };
        }
    };

    // Placeholder Components
    const ProfileComponent = { template: '<div class="p-8"><h1 class="text-3xl font-bold">Profile</h1></div>' };
    const SettingsComponent = { template: '<div class="p-8"><h1 class="text-3xl font-bold">Settings</h1></div>' };
    const MachinesPageComponent = { template: '<div class="p-8"><h1 class="text-3xl font-bold">Machines</h1></div>' };
    const UsersPageComponent = { template: '<div class="p-8"><h1 class="text-3xl font-bold">Users</h1></div>' };
    const ServiceHistoryComponent = { template: '<div class="p-8"><h1 class="text-3xl font-bold">Service History</h1></div>' };
    const SupportComponent = { template: '<div class="p-8"><h1 class="text-3xl font-bold">Support</h1></div>' };


    // --- Main App ---
    const app = createApp({
        setup() {
            const currentView = ref({ main: 'login', sub: '' }); // main: login, user, admin, customer, edit-machine, add-machine, user-details
            const userRole = ref('user'); // user, admin, customer
            const machines = ref(mockMachines);
            const users = ref(mockUsers);
            const selectedMachine = ref(null);
            const currentUser = ref(users.value[0]);

            const viewComponent = computed(() => {
                switch (currentView.value.main) {
                    case 'user':
                        return UserDashboardComponent;
                    case 'admin':
                        return AdminDashboardComponent;
                    case 'customer':
                        return CustomerDashboardComponent;
                    case 'edit-machine':
                        return EditMachineComponent;
                    case 'add-machine':
                        return AddMachineComponent;
                    case 'user-details':
                        return MachineDetailsComponent;
                    default:
                        return OtpLoginComponent;
                }
            });

            const currentProps = computed(() => {
                switch (currentView.value.main) {
                    case 'user':
                        return { machines: machines.value, user: currentUser.value, view: currentView.value.sub };
                    case 'admin':
                        return { machines: machines.value, users: users.value, user: currentUser.value, view: currentView.value.sub };
                    case 'customer':
                        return { machines: machines.value.filter(m => m.customerId === currentUser.value.id), user: currentUser.value, view: currentView.value.sub };
                    case 'edit-machine':
                        return { machine: selectedMachine.value };
                    case 'add-machine':
                        return {};
                    case 'user-details':
                        return { machine: selectedMachine.value };
                    default:
                        return {};
                }
            });

            const login = (role) => {
                userRole.value = role;
                if (role === 'admin') {
                    currentUser.value = users.value[1];
                    currentView.value = { main: 'admin', sub: 'dashboard' };
                } else if (role === 'customer') {
                    currentUser.value = users.value[2];
                    currentView.value = { main: 'customer', sub: 'dashboard' };
                } else {
                    currentUser.value = users.value[0];
                    currentView.value = { main: 'user', sub: 'dashboard' };
                }
            };

            const navigateTo = (view) => {
                currentView.value.sub = view;
            };

            const addMachineHandler = (newMachine) => {
                machines.value.push(newMachine);
                currentView.value.main = userRole.value;
                currentView.value.sub = 'dashboard';
            };

            const showAddMachineForm = () => {
                currentView.value.main = 'add-machine';
            };

            const editMachine = (machine) => {
                selectedMachine.value = machine;
                currentView.value.main = 'edit-machine';
            };

            const saveMachine = (updatedMachine) => {
                const index = machines.value.findIndex(m => m.id === updatedMachine.id);
                if (index !== -1) {
                    machines.value[index] = updatedMachine;
                }
                currentView.value.main = 'admin';
                currentView.value.sub = 'dashboard';
            };

            const cancelEdit = () => {
                currentView.value.main = 'admin';
                currentView.value.sub = 'dashboard';
            };

            const cancelAdd = () => {
                currentView.value.main = userRole.value;
                currentView.value.sub = 'dashboard';
            };

            const logout = () => {
                currentView.value = { main: 'login', sub: '' };
            };

            const viewDetails = (machine) => {
                selectedMachine.value = machine;
                currentView.value.main = 'user-details';
            };

            const backToDashboard = () => {
                currentView.value.main = 'user';
                currentView.value.sub = 'dashboard';
            };

            return {
                viewComponent,
                currentProps,
                login,
                editMachine,
                saveMachine,
                cancelEdit,
                logout,
                viewDetails,
                backToDashboard,
                addMachineHandler,
                showAddMachineForm,
                cancelAdd,
                navigateTo
            };
        },
        template: `
            <component
                :is="viewComponent"
                v-bind="currentProps"
                @login-success="login"
                @edit-machine="editMachine"
                @save-machine="saveMachine"
                @cancel-edit="cancelEdit"
                @add-machine="showAddMachineForm"
                @cancel-add="cancelAdd"
                @add-machine-submit="addMachineHandler"
                @logout="logout"
                @view-details="viewDetails"
                @back-to-dashboard="backToDashboard"
                @navigate="navigateTo"
            />
        `
    });

    app.mount('#app');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').then(registration => {
          console.log('SW registered: ', registration);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
</script>

</body>
</html>
