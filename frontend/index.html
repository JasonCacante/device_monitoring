<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#137fec",
                    "background-light": "#f6f7f8",
                    "background-dark": "#101922",
                    "neutral-light": "#FFFFFF",
                    "neutral-dark": "#2D3748",
                    "text-light-primary": "#2D3748",
                    "text-dark-primary": "#F4F7FA",
                    "text-light-secondary": "#617589",
                    "text-dark-secondary": "#9CA3AF",
                    "border-light": "#dbe0e6",
                    "border-dark": "#3a4a5a",
                    "green-status": "#2ECC71",
                    "red-status": "#E74C3C",
                    "yellow-status": "#F39C12"
                },
                fontFamily: {
                    "display": ["Inter", "sans-serif"]
                },
                borderRadius: {
                    "DEFAULT": "0.5rem",
                    "lg": "0.75rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
            },
        },
    }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-200">
    <div id="app"></div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module">
        const { createApp, ref, reactive, computed } = Vue

        const App = {
            setup() {
                // --- MOCK DATA ---
                const mockUser = {
                    email: 'user@example.com',
                    otp: '123456'
                };

                const machines = reactive([
                    { id: 1, name: 'CNC-Mill-001', status: 'Online', location: 'New York, USA', lastCheckin: '2 minutes ago', details: { assetId: 'ASSET-001', serial: 'SN-001', temp: 85, department: 'Manufacturing', notes: 'Replaced spindle motor. Calibrated axis alignment.' } },
                    { id: 2, name: 'Laser-Cutter-003', status: 'Offline', location: 'London, UK', lastCheckin: '3 hours ago', details: { assetId: 'ASSET-002', serial: 'SN-002', temp: 40, department: 'Fabrication', notes: 'Laser alignment check required.' } },
                    { id: 3, name: '3D-Printer-005', status: 'Warning', location: 'Tokyo, Japan', lastCheckin: '15 minutes ago', details: { assetId: 'ASSET-003', serial: 'SN-003', temp: 95, department: 'Prototyping', notes: 'Extruder temperature fluctuating.' } },
                    { id: 4, name: 'Robotic-Arm-002', status: 'Maintenance', location: 'Berlin, Germany', lastCheckin: '1 day ago', details: { assetId: 'ASSET-004', serial: 'SN-004', temp: 60, department: 'Assembly', notes: 'Scheduled joint lubrication.' } },
                    { id: 5, name: 'Packaging-Unit-007', status: 'Online', location: 'Sydney, Australia', lastCheckin: '5 minutes ago', details: { assetId: 'ASSET-005', serial: 'SN-005', temp: 75, department: 'Logistics', notes: 'System check passed.' } }
                ]);

                // --- ROUTING ---
                const currentView = ref('emailLogin'); // 'emailLogin', 'otpVerification', 'dashboard', 'details'
                const selectedMachine = ref(null);
                const isAuthenticated = ref(false);

                const navigate = (view, machineId = null) => {
                    if (view === 'details' && machineId) {
                        selectedMachine.value = machines.find(m => m.id === machineId);
                        if(selectedMachine.value) currentView.value = 'details';
                    } else {
                        currentView.value = view;
                    }
                };

                // --- AUTHENTICATION ---
                const email = ref('');
                const otp = ref(Array(6).fill(''));
                const otpError = ref(false);

                const requestOtp = () => {
                    // In a real app, this would trigger an API call to send an OTP
                    console.log(`OTP requested for ${email.value}`);
                    navigate('otpVerification');
                };

                const verifyOtp = () => {
                    const enteredOtp = otp.value.join('');
                    if (enteredOtp === mockUser.otp) {
                        isAuthenticated.value = true;
                        otpError.value = false;
                        navigate('dashboard');
                    } else {
                        otpError.value = true;
                    }
                };

                const logout = () => {
                    isAuthenticated.value = false;
                    email.value = '';
                    otp.value = Array(6).fill('');
                    navigate('emailLogin');
                }

                return {
                    currentView,
                    selectedMachine,
                    isAuthenticated,
                    navigate,
                    machines,
                    email,
                    otp,
                    otpError,
                    requestOtp,
                    verifyOtp,
                    logout
                }
            },
            template: `
                <div v-if="!isAuthenticated">
                    <div v-if="currentView === 'emailLogin'" class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden p-4">
                        <div class="w-full max-w-md">
                            <div class="flex justify-center mb-6">
                                <svg class="h-10 w-auto text-primary" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M24 6L10 14V30L24 38L38 30V14L24 6Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
                                    <path d="M10 14L24 22L38 14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
                                    <path d="M24 38V22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
                                </svg>
                            </div>
                            <div class="flex flex-col gap-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-background-dark shadow-sm p-8">
                                <div class="text-center">
                                    <h1 class="text-[#111418] dark:text-white tracking-tight text-[32px] font-bold leading-tight">Welcome Back</h1>
                                    <p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal mt-2">Enter your email to receive a login code.</p>
                                </div>
                                <form @submit.prevent="requestOtp" class="flex flex-col gap-6 mt-4">
                                    <label class="flex flex-col">
                                        <p class="text-[#111418] dark:text-gray-200 text-base font-medium leading-normal pb-2">Email</p>
                                        <input v-model="email" type="email" required class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white dark:bg-gray-800/50 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-gray-700 bg-white focus:border-primary h-14 placeholder:text-[#617589] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal transition-all duration-200" placeholder="Enter your email address"/>
                                    </label>
                                    <button class="flex items-center justify-center text-center font-medium text-base h-14 px-6 rounded-lg bg-primary text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark transition-colors w-full" type="submit">
                                        Get Login Code
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div v-if="currentView === 'otpVerification'" class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden p-4">
                        <div class="relative flex w-full max-w-md flex-col overflow-hidden rounded-xl bg-white dark:bg-background-dark shadow-2xl p-8">
                            <div class="flex flex-col items-center justify-center">
                                <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary">
                                    <span class="material-symbols-outlined text-4xl">shield</span>
                                </div>
                                <h1 class="text-[#111827] dark:text-white tracking-tight text-2xl font-bold leading-tight text-center pb-2">Verify Your Identity</h1>
                                <p class="text-gray-600 dark:text-gray-400 text-sm font-normal leading-normal pb-6 text-center">We've sent a verification code to your email address <strong class="text-gray-800 dark:text-gray-200">{{ email }}</strong>.</p>
                                <form @submit.prevent="verifyOtp">
                                    <div class="flex justify-center px-4 py-3 w-full">
                                        <fieldset class="relative flex gap-2 sm:gap-3">
                                            <input v-for="(item, index) in otp" :key="index" v-model="otp[index]" class="flex h-12 w-10 sm:h-14 sm:w-12 text-center text-lg font-bold [appearance:textfield] rounded-lg border border-gray-300 bg-gray-50 focus:border-primary focus:ring-2 focus:ring-primary/50 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:focus:border-primary [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" maxlength="1" type="text" @input="(e) => { if (e.target.value) e.target.nextElementSibling?.focus() }" required />
                                        </fieldset>
                                    </div>
                                    <div v-if="otpError" class="text-red-500 text-sm text-center py-2">Invalid OTP. Please try again.</div>
                                    <div class="flex px-4 pt-3 pb-3 justify-center w-full">
                                        <button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50" type="submit">
                                            <span class="truncate">Verify & Login</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-else class="relative flex min-h-screen w-full">
                    <!-- SideNavBar -->
                    <aside class="flex h-screen w-64 flex-col border-r border-border-light dark:border-border-dark bg-neutral-light dark:bg-neutral-dark/30 sticky top-0">
                        <div class="flex h-16 items-center gap-3 px-6 border-b border-border-light dark:border-border-dark">
                            <div class="size-8 text-primary">
                                <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M39.5563 34.1455V13.8546C39.5563 15.708 36.8773 17.3437 32.7927 18.3189C30.2914 18.916 27.263 19.2655 24 19.2655C20.737 19.2655 17.7086 18.916 15.2073 18.3189C11.1227 17.3437 8.44365 15.708 8.44365 13.8546V34.1455C8.44365 35.9988 11.1227 37.6346 15.2073 38.6098C17.7086 39.2069 20.737 39.5564 24 39.5564C27.263 39.5564 30.2914 39.2069 32.7927 38.6098C36.8773 37.6346 39.5563 35.9988 39.5563 34.1455Z" fill="currentColor"></path>
                                    <path clip-rule="evenodd" d="M10.4485 13.8519C10.4749 13.9271 10.6203 14.246 11.379 14.7361C12.298 15.3298 13.7492 15.9145 15.6717 16.3735C18.0007 16.9296 20.8712 17.2655 24 17.2655C27.1288 17.2655 29.9993 16.9296 32.3283 16.3735C34.2508 15.9145 35.702 15.3298 36.621 14.7361C37.3796 14.246 37.5251 13.9271 37.5515 13.8519C37.5287 13.7876 37.4333 13.5973 37.0635 13.2931C36.5266 12.8516 35.6288 12.3647 34.343 11.9175C31.79 11.0295 28.1333 10.4437 24 10.4437C19.8667 10.4437 16.2099 11.0295 13.657 11.9175C12.3712 12.3647 11.4734 12.8516 10.9365 13.2931C10.5667 13.5973 10.4713 13.7876 10.4485 13.8519ZM37.5563 18.7877C36.3176 19.3925 34.8502 19.8839 33.2571 20.2642C30.5836 20.9025 27.3973 21.2655 24 21.2655C20.6027 21.2655 17.4164 20.9025 14.7429 20.2642C13.1498 19.8839 11.6824 19.3925 10.4436 18.7877V34.1275C10.4515 34.1545 10.5427 34.4867 11.379 35.027C12.298 35.6207 13.7492 36.2054 15.6717 36.6644C18.0007 37.2205 20.8712 37.5564 24 37.5564C27.1288 37.5564 29.9993 37.2205 32.3283 36.6644C34.2508 36.2054 35.702 35.6207 36.621 35.027C37.4573 34.4867 37.5485 34.1546 37.5563 34.1275V18.7877ZM41.5563 13.8546V34.1455C41.5563 36.1078 40.158 37.5042 38.7915 38.3869C37.3498 39.3182 35.4192 40.0389 33.2571 40.5551C30.5836 41.1934 27.3973 41.5564 24 41.5564C20.6027 41.5564 17.4164 41.1934 14.7429 40.5551C12.5808 40.0389 10.6502 39.3182 9.20848 38.3869C7.84205 37.5042 6.44365 36.1078 6.44365 34.1455L6.44365 13.8546C6.44365 12.2684 7.37223 11.0454 8.39581 10.2036C9.43325 9.3505 10.8137 8.67141 12.343 8.13948C15.4203 7.06909 19.5418 6.44366 24 6.44366C28.4582 6.44366 32.5797 7.06909 35.657 8.13948C37.1863 8.67141 38.5667 9.3505 39.6042 10.2036C40.6278 11.0454 41.5563 12.2684 41.5563 13.8546Z" fill="currentColor" fill-rule="evenodd"></path>
                                </svg>
                            </div>
                            <h2 class="text-text-light-primary dark:text-text-dark-primary text-lg font-bold">Machine Manager</h2>
                        </div>
                        <div class="flex flex-1 flex-col justify-between p-4">
                            <div class="flex flex-col gap-2">
                                <a @click="navigate('dashboard')" href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5" :class="{'bg-primary/20 text-primary dark:bg-primary/30': currentView === 'dashboard'}">
                                    <span class="material-symbols-outlined">dashboard</span>
                                    <p class="text-sm font-semibold">Dashboard</p>
                                </a>
                            </div>
                            <div class="flex flex-col gap-2">
                               <a @click="logout" href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-light-secondary hover:bg-black/5 dark:text-text-dark-secondary dark:hover:bg-white/5">
                                    <span class="material-symbols-outlined">logout</span>
                                    <p class="text-sm font-medium leading-normal">Logout</p>
                                </a>
                            </div>
                        </div>
                    </aside>
                    <main class="flex-1">
                        <div v-if="currentView === 'dashboard'" class="p-8">
                            <div class="mx-auto max-w-7xl">
                                <!-- PageHeading -->
                                <div class="flex flex-wrap justify-between gap-4 mb-8">
                                    <div class="flex flex-col gap-1">
                                        <p class="text-text-light-primary dark:text-text-dark-primary text-3xl font-bold leading-tight tracking-tight">My Machines Dashboard</p>
                                        <p class="text-text-light-secondary dark:text-text-dark-secondary text-base font-normal">An overview of your assigned machines and their current status.</p>
                                    </div>
                                </div>
                                <!-- Machine List Table -->
                                <div class="overflow-x-auto rounded-lg border border-border-light dark:border-border-dark bg-neutral-light dark:bg-neutral-dark/30">
                                    <table class="w-full text-left">
                                        <thead class="text-xs font-semibold uppercase text-text-light-secondary dark:text-text-dark-secondary bg-background-light dark:bg-neutral-dark">
                                            <tr>
                                                <th class="px-6 py-4">Machine Name</th>
                                                <th class="px-6 py-4">Status</th>
                                                <th class="px-6 py-4">Location</th>
                                                <th class="px-6 py-4">Last Check-in</th>
                                                <th class="px-6 py-4">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-border-light dark:divide-border-dark">
                                            <tr v-for="machine in machines" :key="machine.id" class="hover:bg-background-light dark:hover:bg-neutral-dark/50">
                                                <td class="px-6 py-4 text-sm font-semibold text-text-light-primary dark:text-text-dark-primary">{{ machine.name }}</td>
                                                <td class="px-6 py-4">
                                                    <div class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-medium" :class="{ 'bg-green-100 dark:bg-green-500/20 text-green-700 dark:text-green-300': machine.status === 'Online', 'bg-red-100 dark:bg-red-500/20 text-red-700 dark:text-red-300': machine.status === 'Offline', 'bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300': machine.status === 'Warning', 'bg-gray-100 dark:bg-gray-500/20 text-gray-700 dark:text-gray-300': machine.status === 'Maintenance' }">
                                                        <div class="size-2 rounded-full" :class="{ 'bg-green-500': machine.status === 'Online', 'bg-red-500': machine.status === 'Offline', 'bg-amber-500': machine.status === 'Warning', 'bg-gray-500': machine.status === 'Maintenance' }"></div>
                                                        {{ machine.status }}
                                                    </div>
                                                </td>
                                                <td class="px-6 py-4 text-sm text-text-light-secondary dark:text-text-dark-secondary">{{ machine.location }}</td>
                                                <td class="px-6 py-4 text-sm text-text-light-secondary dark:text-text-dark-secondary">{{ machine.lastCheckin }}</td>
                                                <td class="px-6 py-4">
                                                    <button @click="navigate('details', machine.id)" class="text-sm font-semibold text-primary hover:underline">View Details</button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div v-if="currentView === 'details'" class="flex-1 p-6 md:p-8 lg:p-10">
                            <div class="max-w-4xl mx-auto">
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <a @click="navigate('dashboard')" href="#" class="text-secondary dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary">Dashboard</a>
                                    <span class="text-secondary dark:text-gray-400 text-sm font-medium leading-normal">/</span>
                                    <span class="text-text-light dark:text-text-dark text-sm font-medium leading-normal">{{ selectedMachine.name }}</span>
                                </div>
                                <div class="flex flex-wrap justify-between gap-3 mb-8">
                                    <h1 class="text-text-light dark:text-text-dark text-3xl font-bold leading-tight">Edit {{ selectedMachine.name }}</h1>
                                </div>
                                <div class="bg-white dark:bg-background-dark rounded-xl shadow-sm border border-border-light dark:border-border-dark p-6 md:p-8">
                                    <form @submit.prevent>
                                        <div class="space-y-8">
                                            <div>
                                                <h3 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-tight mb-4">Machine Identification</h3>
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <label class="flex flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal pb-2">Machine Name</p><input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-white dark:bg-gray-800 h-11 placeholder:text-secondary px-3 text-sm font-normal leading-normal" :value="selectedMachine.name"/></label>
                                                    <label class="flex flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal pb-2">Asset ID</p><input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-white dark:bg-gray-800 h-11 placeholder:text-secondary px-3 text-sm font-normal leading-normal" :value="selectedMachine.details.assetId"/></label>
                                                    <label class="flex flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal pb-2">Serial Number (Read-only)</p><input readonly class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-secondary dark:text-gray-400 focus:outline-0 focus:ring-0 border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-800/50 h-11 placeholder:text-secondary px-3 text-sm font-normal leading-normal cursor-not-allowed" :value="selectedMachine.details.serial"/></label>
                                                </div>
                                            </div>
                                            <div>
                                                <h3 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-tight mb-4">Notes & History</h3>
                                                <div>
                                                    <label class="flex flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal pb-2">Maintenance Notes</p><textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-white dark:bg-gray-800 min-h-32 placeholder:text-secondary p-3 text-sm font-normal leading-normal">{{ selectedMachine.details.notes }}</textarea></label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="flex items-center justify-end gap-4 mt-10 pt-6 border-t border-border-light dark:border-border-dark">
                                            <button @click="navigate('dashboard')" class="px-4 py-2 text-sm font-semibold text-secondary dark:text-gray-300 bg-white dark:bg-gray-700 border border-border-light dark:border-border-dark rounded-lg shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" type="button">Back to Dashboard</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            `
        }

        createApp(App).mount('#app')
    </script>
     <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
